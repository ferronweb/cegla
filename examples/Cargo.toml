[package]
name = "cegla-examples"
version = "0.2.0"
edition = "2021"
publish = false

[[bin]]
name = "lowlevel-cgi-server"
path = "src/lowlevel/server.rs"

[[bin]]
name = "lowlevel-cgi-client"
path = "src/lowlevel/client.rs"

[[bin]]
name = "cgi-server"
path = "src/cgi/server.rs"

[[bin]]
name = "cgi-client"
path = "src/cgi/client.rs"

[[bin]]
name = "scgi-server"
path = "src/scgi/server.rs"

[[bin]]
name = "scgi-client"
path = "src/scgi/client.rs"

[[bin]]
name = "fcgi-server"
path = "src/fcgi/server.rs"


[dependencies]
bytes = "1.11.0"
cegla = { workspace = true, features = ["client", "server"] }
cegla-cgi = { workspace = true, features = ["client", "server"] }
cegla-scgi = { workspace = true, features = ["client", "server"] }
cegla-fcgi = { workspace = true, features = ["server"] }
http = "1.4.0"
http-body-util = "0.1.3"
tokio = { version = "1.49.0", features = ["full"] }
tokio-cegla = { workspace = true, features = ["cgi-client", "scgi-client", "fcgi-server"] }
tokio-util = { version = "0.7.18", features = ["io-util"] }

[dev-dependencies]
shiba = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
